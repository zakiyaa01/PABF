spring.application.name=asrama-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/asrama_unand_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone Configuration (Asia/Jakarta)
spring.jackson.time-zone=Asia/Jakarta
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Multipart File Upload Configuration (Izin Proof Bukti Max 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory and static resource serving
app.upload.dir=uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# JWT Configuration
app.jwt.secret=SIAAsramaUnandEnterpriseSecurityJwtSecretKey2026VeryLongSuperSecretKeyForHmacSha256
app.jwt.access-expiration-ms=7200000
app.jwt.refresh-expiration-ms=604800000

# Presensi Rules & Guardrails
app.presensi.enforce-time-window=true
app.presensi.subuh.start=04:00
app.presensi.subuh.end=06:00
app.presensi.subuh.grace=06:15
app.presensi.malam.start=18:00
app.presensi.malam.end=20:30
app.presensi.malam.grace=20:45
app.presensi.enforce-geofence=true
app.presensi.enforce-device-binding=true

